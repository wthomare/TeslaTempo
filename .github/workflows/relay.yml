name: Relay checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/relay/requirements*.txt
      - name: Install test dependencies
        working-directory: services/relay
        run: pip install -r requirements-dev.txt
      - name: Test with mocked Tesla transport
        working-directory: services/relay
        run: python -m pytest -q
      - name: Prepare local mock secrets
        run: python scripts/init-local.py
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build and start mock relay
        run: docker compose up -d --build --wait --wait-timeout 60
      - name: Verify running container
        run: python scripts/check-running.py
      - name: Stop containers
        if: always()
        run: docker compose down
