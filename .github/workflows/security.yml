name: Security checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install audit tools
        run: pip install pip-audit==2.10.1 bandit==1.9.4
      - name: Audit pinned runtime dependencies
        run: pip-audit -r services/relay/requirements.txt --no-deps --disable-pip
      - name: Reject medium and high severity static findings
        run: bandit -r services/relay/relay services/diagnostics -ll
      - name: Check release boundaries
        run: python scripts/check-release-boundaries.py
