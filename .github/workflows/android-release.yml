name: Publish verified Android APK
on:
  push:
    branches: ['apk/**']
permissions:
  contents: read
concurrency:
  group: android-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Install public APK verification tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0"'
      - name: Check metadata, checksum, signing identity and release manifest
        run: |
          python3 - <<'PY'
          import json, re, subprocess, pathlib
          m = json.loads(pathlib.Path('.release/metadata.json').read_text())
          assert re.fullmatch(r'0\.\d+\.\d+', m['version'])
          assert m['tag'] == 'v' + m['version']
          assert m['source'] == subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip()
          PY
          cd .release
          sha256sum --check SHA256SUMS
          cd ..
          python3 scripts/verify-apk.py .release/teslatempo-release.apk --sdk "$ANDROID_HOME" --version "$(jq -r .version .release/metadata.json)" --certificate cf9640b2484acdfdf1aa6cc381bca534318d1b1fc50d776ffb1dc3d86acc3214
      - name: Publish test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$(jq -r .tag .release/metadata.json)" \
            --target "$(jq -r .source .release/metadata.json)" \
            --title "TeslaTempo Android $(jq -r .version .release/metadata.json) — version de test" \
            --notes-file .release/NOTES.md --prerelease \
            .release/teslatempo-release.apk .release/SHA256SUMS .release/SIGNATURE.txt
