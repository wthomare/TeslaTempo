plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def signingFilePath = System.getenv('TESLATEMPO_SIGNING_FILE')
def signingValues = signingFilePath ? new groovy.json.JsonSlurper().parse(new File(signingFilePath)) : null

android {
    namespace 'org.teslatempo'
    compileSdk 36
    defaultConfig {
        applicationId 'org.teslatempo'
        minSdk 33
        targetSdk 36
        versionCode 12
        versionName '0.12.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        if (signingValues) {
            release {
                storeFile file(signingValues.storeFile)
                storePassword signingValues.storePassword
                keyAlias signingValues.keyAlias
                keyPassword signingValues.keyPassword
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.debug'; versionNameSuffix '-dev' }
        release {
            minifyEnabled false
            if (signingValues) signingConfig signingConfigs.release
        }
    }
    buildFeatures { compose true; buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
kotlin { compilerOptions { jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17 } }

dependencies {
    implementation project(':tesla-protocol')
    implementation platform('androidx.compose:compose-bom:2025.08.01')
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.2'
    implementation 'androidx.datastore:datastore-preferences:1.1.7'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.13.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    androidTestImplementation platform('androidx.compose:compose-bom:2025.08.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}

// Public dependency inventory for release audits; no environment or signing values.
tasks.register('writeReleaseDependencyInventory') {
    doLast {
        def modules = configurations.releaseRuntimeClasspath.resolvedConfiguration.resolvedArtifacts.findAll {
            it.id.componentIdentifier instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier
        }.collect {
            def module = it.moduleVersion.id
            [name: "${module.group}:${module.name}", version: module.version]
        }.unique().sort { a, b -> a.name <=> b.name }
        def output = layout.buildDirectory.file('reports/security/dependencies.json').get().asFile
        output.parentFile.mkdirs()
        output.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(modules))
    }
}
