# Complete TrueNAS Custom App with HTTPS. Replace POOL, UID:GID, NAS IP and domain.
# See docs/https-truenas.md. Build the relay image on the NAS first.
services:
  relay:
    image: teslatempo-relay:0.3.0
    pull_policy: never
    user: "1000:1000"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 256m
    cpus: 1.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    ports:
      - "127.0.0.1:18080:8080"
    environment:
      RELAY_MODE: mock
      PUBLIC_BASE_URL: https://relay.example.com
      TESLA_REGION: eu
      TESLA_CLIENT_ID: ""
      DATA_DIR: /data
      RELAY_API_TOKEN_FILE: /run/secrets/relay_api_token
      TOKEN_ENCRYPTION_KEY_FILE: /run/secrets/token_encryption_key
      TESLA_CLIENT_SECRET_FILE: /run/secrets/tesla_client_secret
      TESLA_PUBLIC_KEY_FILE: /run/secrets/tesla_public_key.pem
    volumes:
      - /mnt/POOL/teslatempo/source/data:/data
    secrets:
      - relay_api_token
      - token_encryption_key
      - tesla_client_secret
      - source: tesla_public_key
        target: tesla_public_key.pem
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 256m
    cpus: 1.0
    ports:
      - "192.0.2.25:18081:80"
      - "192.0.2.25:18443:443"
    volumes:
      - /mnt/POOL/teslatempo/source/Caddyfile:/etc/caddy/Caddyfile:ro
      - /mnt/POOL/teslatempo/caddy-data:/data
      - /mnt/POOL/teslatempo/caddy-config:/config
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

secrets:
  relay_api_token:
    file: /mnt/POOL/teslatempo/source/secrets/relay_api_token
  token_encryption_key:
    file: /mnt/POOL/teslatempo/source/secrets/token_encryption_key
  tesla_client_secret:
    file: /mnt/POOL/teslatempo/source/secrets/tesla_client_secret
  tesla_public_key:
    file: /mnt/POOL/teslatempo/source/secrets/tesla_public_key.pem
