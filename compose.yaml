name: teslatempo
services:
  relay:
    build: ./services/relay
    image: teslatempo-relay:0.2.0
    user: "${RELAY_UID:-1000}:${RELAY_GID:-1000}"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 256m
    cpus: 1.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    ports:
      - "${RELAY_BIND_ADDRESS:-127.0.0.1}:${RELAY_PORT:-8080}:8080"
    environment:
      RELAY_MODE: ${RELAY_MODE:-mock}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      TESLA_REGION: ${TESLA_REGION:-eu}
      TESLA_CLIENT_ID: ${TESLA_CLIENT_ID:-}
      DATA_DIR: /data
      RELAY_API_TOKEN_FILE: /run/secrets/relay_api_token
      TOKEN_ENCRYPTION_KEY_FILE: /run/secrets/token_encryption_key
      TESLA_CLIENT_SECRET_FILE: /run/secrets/tesla_client_secret
      TESLA_PUBLIC_KEY_FILE: /run/secrets/tesla_public_key.pem
    volumes:
      - ./data:/data
    secrets:
      - relay_api_token
      - token_encryption_key
      - tesla_client_secret
      - source: tesla_public_key
        target: tesla_public_key.pem

secrets:
  relay_api_token:
    file: ./secrets/relay_api_token
  token_encryption_key:
    file: ./secrets/token_encryption_key
  tesla_client_secret:
    file: ./secrets/tesla_client_secret
  tesla_public_key:
    file: ./secrets/tesla_public_key.pem
